name: Build Nordeluna APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nordeluna-android.yml
      - android/**
      - game-assets/**
      - ios/Nordeluna/Assets.xcassets/AppIcon.appiconset/nordeluna-appicon-1024-rgb.png

permissions:
  contents: read

env:
  MKXP_Z_COMMIT: 17a5ec6cb3e8d2de05a82451bc4910f36517d322
  REFERENCE_APK_URL: https://codeberg.org/warmwinter/mkxp-z/releases/download/uranium-android@0.2.0/uranium-0.2.0.apk
  REFERENCE_APK_SHA256: 4a520f7784f1f7e3493c9970da0748a483a0f88400627bcc6a705529c1407653
  GAME_ARCHIVE_SHA256: 38cb643add9b0bf5bc2bfa505342cfc6af321de96ebc2f0cae761ef04f973f73

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Nordeluna
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Reconstruct private game archive
        run: |
          set -euo pipefail
          mkdir -p build-android
          cat game-assets/game-assets.zip.part* > build-android/nordeluna-game.zip
          echo "$GAME_ARCHIVE_SHA256  build-android/nordeluna-game.zip" | sha256sum --check --strict
          unzip -tq build-android/nordeluna-game.zip

      - name: Prepare Android-compatible audio
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential cmake ffmpeg fluidsynth \
            libtool meson nasm ninja-build pkg-config wget
          bash scripts/prepare-android-game.sh \
            build-android/nordeluna-game.zip \
            build-android/nordeluna-android-game.zip

      - name: Fetch pinned Android engine source
        run: |
          set -euo pipefail
          git clone --no-checkout https://codeberg.org/warmwinter/mkxp-z.git build-android/mkxp-z
          git -C build-android/mkxp-z checkout "$MKXP_Z_COMMIT"
          git -C build-android/mkxp-z apply "$GITHUB_WORKSPACE/android/nordeluna.patch"
          git -C build-android/mkxp-z apply "$GITHUB_WORKSPACE/android/nordeluna-v2.patch"
          git -C build-android/mkxp-z apply "$GITHUB_WORKSPACE/android/controller-fallback.patch"
          git -C build-android/mkxp-z apply "$GITHUB_WORKSPACE/android/universal-x86.patch"

      - name: Cache x86_64 native engine
        uses: actions/cache@v4
        with:
          path: |
            build-android/mkxp-z/android/deps
            build-android/mkxp-z/android/build-x86_64
            build-android/mkxp-z/android/app/src/main/jniLibs/x86_64
          key: nordeluna-x86_64-${{ runner.os }}-${{ env.MKXP_Z_COMMIT }}-${{ hashFiles('android/*.patch') }}

      - name: Preserve sideload signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nordeluna-sideload-signing-v1

      - name: Build native x86_64 engine for emulators
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_NDK_HOME:-}" || ! -d "$ANDROID_NDK_HOME" ]]; then
            if [[ -n "${ANDROID_NDK_ROOT:-}" && -d "$ANDROID_NDK_ROOT" ]]; then
              export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
            elif [[ -n "${ANDROID_NDK_LATEST_HOME:-}" && -d "$ANDROID_NDK_LATEST_HOME" ]]; then
              export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
            else
              echo "Android NDK not found on the GitHub runner" >&2
              exit 1
            fi
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          chmod +x build-android/mkxp-z/android/build.sh
          chmod +x build-android/mkxp-z/android/deps/get_deps.sh
          cd build-android/mkxp-z/android
          export GEM_HOME="$PWD/deps/build-x86_64/lib/ruby/gems/3.1.0"
          export GEM_PATH="$GEM_HOME"
          ABIS=x86_64 ./build.sh

      - name: Fetch pinned native Android libraries
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$REFERENCE_APK_URL" --output build-android/reference.apk
          echo "$REFERENCE_APK_SHA256  build-android/reference.apk" | sha256sum --check --strict
          mkdir -p build-android/native
          unzip -q build-android/reference.apk 'lib/arm64-v8a/*' -d build-android/native
          mkdir -p build-android/mkxp-z/android/app/src/main/jniLibs
          cp -R build-android/native/lib/arm64-v8a build-android/mkxp-z/android/app/src/main/jniLibs/

      - name: Bundle Nordeluna and app icon
        run: |
          set -euo pipefail
          APP_MAIN=build-android/mkxp-z/android/app/src/main
          mkdir -p "$APP_MAIN/assets"
          cp build-android/nordeluna-android-game.zip "$APP_MAIN/assets/nordeluna-game.zip"
          cp ios/Nordeluna/Assets.xcassets/AppIcon.appiconset/nordeluna-appicon-1024-rgb.png \
            "$APP_MAIN/res/drawable/nordeluna_icon.png"

      - name: Build installable APK
        working-directory: build-android/mkxp-z/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and name APK
        run: |
          set -euo pipefail
          APK="$(find build-android/mkxp-z/android/app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -F 'assets/nordeluna-game.zip'
          for ABI in arm64-v8a x86_64; do
            unzip -l "$APK" | grep -F "lib/$ABI/libmkxp-z.so"
            unzip -l "$APK" | grep -F "lib/$ABI/libruby.so"
            unzip -l "$APK" | grep -F "lib/$ABI/libSDL2.so"
          done
          cp "$APK" build-android/Nordeluna-Android-universal-v1.2.apk
          sha256sum build-android/Nordeluna-Android-universal-v1.2.apk > build-android/Nordeluna-Android-universal-v1.2.apk.sha256
          ls -lh build-android/Nordeluna-Android-universal-v1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nordeluna-Android-universal-v1.2
          path: |
            build-android/Nordeluna-Android-universal-v1.2.apk
            build-android/Nordeluna-Android-universal-v1.2.apk.sha256
          compression-level: 0
          retention-days: 14

