name: Build Nordeluna APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nordeluna-android.yml
      - android/**
      - game-assets/**
      - scripts/prepare-android-archive.py
      - scripts/prepare-client-android.py
      - scripts/prepare-android-game.sh
      - scripts/prepare-android-movies.py
      - scripts/pack-android-directory.py
      - scripts/tests/**
      - scripts/test-touch-controls.py
      - scripts/updater_core.py
      - server/**

permissions:
  contents: write

env:
  MKXP_Z_COMMIT: 17a5ec6cb3e8d2de05a82451bc4910f36517d322
  REFERENCE_APK_URL: https://codeberg.org/warmwinter/mkxp-z/releases/download/uranium-android@0.2.0/uranium-0.2.0.apk
  REFERENCE_APK_SHA256: 4a520f7784f1f7e3493c9970da0748a483a0f88400627bcc6a705529c1407653
  GAME_ARCHIVE_SHA256: e56d7443a2f52b843eb05db32c7fdf4562042048a1f31a0034ca817355614e90

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE: ${{ secrets.NORDELUNA_ANDROID_KEYSTORE }}

    steps:
      - name: Checkout Nordeluna
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Validate Android packaging scripts
        run: |
          python3 -m pip install cryptography==46.0.3
          python3 -m unittest discover -s scripts/tests

      - name: Reconstruct private game archive
        run: |
          set -euo pipefail
          mkdir -p build-android
          cat game-assets/game-assets.zip.part* > build-android/nordeluna-original.zip
          echo "$GAME_ARCHIVE_SHA256  build-android/nordeluna-original.zip" | sha256sum --check --strict
          unzip -tq build-android/nordeluna-original.zip

      - name: Repair Android paths and audio
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fluidsynth ruby
          python3 scripts/prepare-android-archive.py \
            build-android/nordeluna-original.zip \
            build-android/nordeluna-utf8.zip \
            android/mkxp-android.json
          bash scripts/prepare-android-game.sh \
            build-android/nordeluna-utf8.zip \
            build-android/nordeluna-game.zip

      - name: Fetch pinned Android engine source
        run: |
          set -euo pipefail
          git clone --no-checkout https://codeberg.org/warmwinter/mkxp-z.git build-android/mkxp-z
          git -C build-android/mkxp-z checkout "$MKXP_Z_COMMIT"
          git -C build-android/mkxp-z apply "$GITHUB_WORKSPACE/android/nordeluna.patch"
          python3 scripts/test-performance-panel.py build-android/mkxp-z

      - name: Check touch controls visibility
        run: python3 scripts/test-touch-controls.py build-android/mkxp-z

      - name: Preserve sideload signing key
        if: env.ANDROID_KEYSTORE == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nordeluna-sideload-signing-v1

      - name: Load private signing key
        if: env.ANDROID_KEYSTORE != ''
        run: |
          mkdir -p ~/.android
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore

      - name: Prepare encrypted migration of existing signing key
        if: env.ANDROID_KEYSTORE == ''
        run: |
          test -s ~/.android/debug.keystore
          python3 scripts/export-build-signing-key.py ~/.android/debug.keystore build-android/signing-key.enc.json

      - name: Export encrypted signing migration
        if: env.ANDROID_KEYSTORE == ''
        uses: actions/upload-artifact@v4
        with:
          name: Nordeluna-signing-migration-encrypted
          path: build-android/signing-key.enc.json
          retention-days: 1

      - name: Fetch pinned native Android libraries
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$REFERENCE_APK_URL" --output build-android/reference.apk
          echo "$REFERENCE_APK_SHA256  build-android/reference.apk" | sha256sum --check --strict
          mkdir -p build-android/native
          unzip -q build-android/reference.apk 'lib/arm64-v8a/*' -d build-android/native
          mkdir -p build-android/mkxp-z/android/app/src/main/jniLibs
          cp -R build-android/native/lib/arm64-v8a build-android/mkxp-z/android/app/src/main/jniLibs/

      - name: Bundle Nordeluna and app icon
        run: |
          set -euo pipefail
          APP_MAIN=build-android/mkxp-z/android/app/src/main
          mkdir -p "$APP_MAIN/assets"
          cp android/CrashDiagnostics.java "$APP_MAIN/java/com/mkxpz/launcher/CrashDiagnostics.java"
          cp android/OnlineBridge.java "$APP_MAIN/java/com/mkxpz/launcher/OnlineBridge.java"
          cp android/MovieMailbox.java "$APP_MAIN/java/com/mkxpz/launcher/MovieMailbox.java"
          cp android/AndroidMovieBridge.java "$APP_MAIN/java/com/mkxpz/launcher/AndroidMovieBridge.java"
          cp android/PerformanceOptions.java "$APP_MAIN/java/com/mkxpz/launcher/PerformanceOptions.java"
          cp build-android/nordeluna-game.zip "$APP_MAIN/assets/nordeluna-game.zip"
          cp android/nordeluna-display.rb "$APP_MAIN/assets/nordeluna-display.rb"
          cp android/assets/nordeluna-launcher.png \
            "$APP_MAIN/res/drawable/nordeluna_icon.png"
          python3 scripts/prepare-client-android.py build-android/mkxp-z

      - name: Build installable APK
        working-directory: build-android/mkxp-z/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleStableDebug :app:assembleBetaDebug

      - name: Verify and name APK
        run: |
          set -euo pipefail
          APK="$(find build-android/mkxp-z/android/app/build/outputs/apk/stable/debug -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -F 'assets/nordeluna-game.zip'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libmkxp-z.so'
          cp "$APK" build-android/Nordeluna-Android-arm64-v1.16.3.apk
          TESTERS="$(find build-android/mkxp-z/android/app/build/outputs/apk/beta/debug -name '*.apk' -type f -print -quit)"
          test -n "$TESTERS"
          cp "$TESTERS" build-android/Nordeluna-Android-testers-arm64-v1.16.3.apk
          sha256sum build-android/Nordeluna-Android-testers-arm64-v1.16.3.apk > build-android/Nordeluna-Android-testers-arm64-v1.16.3.apk.sha256
          sha256sum build-android/Nordeluna-Android-arm64-v1.16.3.apk > build-android/Nordeluna-Android-arm64-v1.16.3.apk.sha256
          ls -lh build-android/Nordeluna-Android-arm64-v1.16.3.apk

      - name: Verify Android launcher backups
        run: |
          JSON_JAR="$(find ~/.gradle/caches/modules-2/files-2.1/org.json/json -name '*.jar' -print -quit)"
          test -n "$JSON_JAR"
          mkdir -p build-android/launcher-tests
          python3 scripts/tester-build-tools.py build-android/tester-fixture --fixture
          javac --release 8 -encoding UTF-8 -cp "$JSON_JAR" -d build-android/launcher-tests android/ClientFiles.java android/ClientRepair.java android/TesterAccess.java scripts/fixtures/ClientFilesTest.java scripts/fixtures/ClientRepairTest.java scripts/fixtures/TesterAccessTest.java
          java -cp "build-android/launcher-tests:$JSON_JAR" ClientFilesTest "$(mktemp -d)"
          java -cp "build-android/launcher-tests:$JSON_JAR" ClientRepairTest "$(mktemp -d)"
          java -cp "build-android/launcher-tests:$JSON_JAR" TesterAccessTest build-android/tester-fixture

      - name: Protect testers APK before distribution
        run: |
          python3 -m pip install cryptography==46.0.3
          python3 scripts/tester-build-tools.py build-android/Nordeluna-Android-testers-arm64-v1.16.3.apk build-android/Nordeluna-Android-testers-arm64-v1.16.3.apk.locked
          rm build-android/Nordeluna-Android-testers-arm64-v1.16.3.apk build-android/Nordeluna-Android-testers-arm64-v1.16.3.apk.sha256

      - name: Upload encrypted testers package
        uses: actions/upload-artifact@v4
        with:
          name: Nordeluna-Android-testers-arm64-v1.16.3
          path: |
            build-android/Nordeluna-Android-testers-arm64-v1.16.3.apk.locked
            build-android/Nordeluna-Android-testers-arm64-v1.16.3.apk.locked.json
          compression-level: 0
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nordeluna-Android-arm64-v1.16.3
          path: |
            build-android/Nordeluna-Android-arm64-v1.16.3.apk
            build-android/Nordeluna-Android-arm64-v1.16.3.apk.sha256
          compression-level: 0
          retention-days: 14

      - name: Publish Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-1.16.3 --repo "$GITHUB_REPOSITORY" || gh release create android-1.16.3 --repo "$GITHUB_REPOSITORY" --title "Nordeluna Android 1.16.3" --notes-file docs/release-1.16.3.md
          gh release upload android-1.16.3 build-android/Nordeluna-Android-arm64-v1.16.3.apk build-android/Nordeluna-Android-arm64-v1.16.3.apk.sha256 build-android/Nordeluna-Android-testers-arm64-v1.16.3.apk.locked build-android/Nordeluna-Android-testers-arm64-v1.16.3.apk.locked.json --repo "$GITHUB_REPOSITORY" --clobber

