name: Build Nordeluna IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nordeluna.yml
      - ios/Nordeluna/**
      - ios/Empo/src/App/**
      - scripts/**

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          "$XCODE/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Reconstruct private game assets
        run: bash scripts/reconstruct-nordeluna-assets.sh

      - name: Fetch published mkxp-z iOS core
        run: bash scripts/fetch-mkxp-core.sh

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/Nordeluna
        run: xcodegen generate --spec project.yml --project . --quiet

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Nordeluna/Nordeluna.xcodeproj \
            -scheme Nordeluna \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            build 2>&1 | tee build.log | tail -n 80
          test -d build/Release-iphoneos/Nordeluna.app

      - name: Sign ad-hoc and package IPA
        run: |
          set -e
          APP="build/Release-iphoneos/Nordeluna.app"
          codesign --force --sign - --timestamp=none "$APP/Frameworks/MkxpCore.framework"
          codesign --force --sign - \
            --generate-entitlement-der \
            --entitlements ios/Nordeluna/Nordeluna.entitlements \
            "$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/Nordeluna.app
          (cd build/ipa && zip -qr Nordeluna-unsigned.ipa Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nordeluna-unsigned-ipa
          path: build/ipa/Nordeluna-unsigned.ipa
          retention-days: 7
