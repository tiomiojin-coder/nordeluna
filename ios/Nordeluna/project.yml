name: Nordeluna
options:
  bundleIdPrefix: local.tiomi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    HEADER_SEARCH_PATHS:
      - $(PROJECT_DIR)/../Empo/src/App
    LD_RUNPATH_SEARCH_PATHS:
      - $(inherited)
      - "@executable_path/Frameworks"
targets:
  Nordeluna:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Embed MkxpCore
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SOURCE="${PROJECT_DIR}/Frameworks/MkxpCore.framework"
          DEST="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          if [ ! -f "$SOURCE/MkxpCore" ]; then
            echo "error: MkxpCore.framework ausente. Execute scripts/fetch-mkxp-core.sh." >&2
            exit 1
          fi
          mkdir -p "$DEST"
          rm -rf "$DEST/MkxpCore.framework"
          cp -R "$SOURCE" "$DEST/MkxpCore.framework"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ]; then
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
              --preserve-metadata=identifier,entitlements,flags \
              --timestamp=none "$DEST/MkxpCore.framework"
          fi
    sources:
      - path: src
        type: group
      - path: ../Empo/src/App/GameCoreForwarders.c
      - path: ../Empo/src/App/main.m
      - path: ../Empo/src/App/AppLoader.m
      - path: ../Empo/src/App/AudioSession.m
      - path: Assets.xcassets
      - path: BundledGame
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: $(PROJECT_DIR)/Info.plist
        PRODUCT_NAME: Nordeluna
        PRODUCT_BUNDLE_IDENTIFIER: local.tiomi.nordeluna
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Nordeluna.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/src/Nordeluna-Bridging-Header.h
        OTHER_LDFLAGS:
          - -framework Foundation
          - -framework UIKit
          - -framework AVFoundation
          - -framework QuartzCore
          - -framework GameController
schemes:
  Nordeluna:
    build:
      targets:
        Nordeluna: all
    run:
      config: Debug
    archive:
      config: Release
